limit_req_zone $binary_remote_addr zone=fullcount_login:1m rate=6r/m;

server {
    listen 80;
    server_name EC2_PUBLIC_IP;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/fullcount-acme;
    }

    location / {
        return 308 https://EC2_PUBLIC_IP$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name EC2_PUBLIC_IP;

    ssl_certificate /etc/letsencrypt/live/fullcount-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fullcount-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 21m;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;

    location = /api/admin/login {
        limit_req zone=fullcount_login burst=6 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
    }

    location / {
        return 404;
    }
}
