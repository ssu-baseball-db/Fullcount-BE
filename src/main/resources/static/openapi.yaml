openapi: 3.1.0
info:
  title: 풀카운트 API
  version: '0.1.0'
  description: 업무 기능도와 단위 업무 기술서 기반 계약 초안. 아래 경로는 구현 예정이다.
tags:
  - { name: 선수 기록 }
  - { name: 팀 기록 }
  - { name: 경기 기록 }
  - { name: 선수 비교 및 분석 }
  - name: 관리자
    description: 관리 화면을 도입할 경우의 API 초안이다. 접근 제어 방식은 구현 전에 확정한다.
paths:
  /api/players:
    get:
      tags: [선수 기록]
      summary: 1.1 선수 검색
      operationId: searchPlayers
      description: >-
        이름 부분 일치 검색. 여러 시즌에 해당하면 선수와 시즌별 소속 정보를 반환한다.
        동명이인 구분에는 생년월일·시즌 당시 구단명·포지션을 사용하고,
        선택한 선수의 playerId로 기록 화면에 연결한다.
      parameters:
        - { name: name, in: query, required: true, schema: { type: string, minLength: 1 }, example: 김 }
        - { name: season, in: query, schema: { $ref: '#/components/schemas/Season' }, example: 2024 }
        - { $ref: '#/components/parameters/TeamFilter' }
        - { name: position, in: query, schema: { $ref: '#/components/schemas/Position' } }
      responses:
        '200':
          description: 선수 검색 결과. 일치하는 선수가 없으면 빈 배열.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PlayerSeason' } }
              example:
                - { playerId: sample-a, playerName: 김예시, birthDate: '2000-01-01', season: 2024, teamId: KIA, teamName: KIA, position: '3B' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/seasons/{year}/batting-stats:
    get:
      tags: [선수 기록]
      summary: 1.2 타자 시즌 기록 조회
      operationId: listSeasonBattingStats
      description: >-
        규정타석은 144 × 3.1이며, 정수 타석 기준 447타석 이상이다.
        타율·출루율·장타율·OPS로 정렬하면 규정타석을 충족하고 해당 지표를 계산할 수 있는 선수만 높은 순으로 반환한다.
        이때 qualified=false를 함께 지정하면 400을 반환한다.
      parameters:
        - { $ref: '#/components/parameters/Year' }
        - { $ref: '#/components/parameters/TeamFilter' }
        - { $ref: '#/components/parameters/BattingSort' }
        - { $ref: '#/components/parameters/Qualified' }
      responses:
        '200':
          description: 조건에 맞는 타자 목록. 결과가 없으면 빈 배열.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/BatterRow' } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/seasons/{year}/pitching-stats:
    get:
      tags: [선수 기록]
      summary: 1.3 투수 시즌 기록 조회
      operationId: listSeasonPitchingStats
      description: >-
        규정이닝은 144이닝(432아웃)이다. ERA·WHIP 순위는 지표가 낮은 순으로 반환한다.
        화면의 투구 이닝은 outsPitched를 3아웃당 1이닝으로 환산해 표시한다.
      parameters:
        - { $ref: '#/components/parameters/Year' }
        - { $ref: '#/components/parameters/TeamFilter' }
        - { $ref: '#/components/parameters/PitchingSort' }
        - { $ref: '#/components/parameters/Qualified' }
      responses:
        '200':
          description: 조건에 맞는 투수 목록. 결과가 없으면 빈 배열.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PitcherRow' } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/players/{playerId}/season-stats:
    get:
      tags: [선수 기록]
      summary: 1.4 선수 연도별 추이 조회
      operationId: getPlayerSeasonStats
      description: >-
        시즌 기록은 연도 오름차순으로 반환한다. 화면은 이 목록으로 연도별 표와 대표 지표 추이 그래프를 그린다.
        통산 비율은 2015년 이후 수록된 원천 기록의 합계로 다시 계산한다.
      parameters:
        - { $ref: '#/components/parameters/PlayerId' }
        - { $ref: '#/components/parameters/StatType' }
      responses:
        '200':
          description: 선수 기본 정보, 시즌별 기록과 통산 기록. 해당 유형 기록이 없으면 시즌 목록은 빈 배열, 통산은 null.
          content:
            application/json:
              schema:
                type: object
                required: [player, type, seasons, career]
                properties:
                  player: { $ref: '#/components/schemas/Player' }
                  type: { $ref: '#/components/schemas/StatType' }
                  seasons:
                    type: array
                    items:
                      anyOf:
                        - { $ref: '#/components/schemas/BatterRow' }
                        - { $ref: '#/components/schemas/PitcherRow' }
                  career:
                    anyOf:
                      - { $ref: '#/components/schemas/BattingStats' }
                      - { $ref: '#/components/schemas/PitchingStats' }
                      - { type: 'null' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/seasons/{year}/standings:
    get:
      tags: [팀 기록]
      summary: 시즌별 공식 팀 순위 조회
      operationId: listOfficialStandings
      description: 해당 시즌 마지막 공식 기준일의 KBO 발표 순위 순으로 반환한다. 승률은 0부터 1 사이 값이다.
      parameters:
        - { $ref: '#/components/parameters/Year' }
      responses:
        '200':
          description: 공식 순위 목록. 결과가 없으면 빈 배열.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Standing' } }
              example:
                - { rank: 1, teamId: KIA, teamName: KIA, wins: 87, losses: 55, draws: 2, winningPct: 0.613, games: 144, gamesBehind: 0, asOfDate: '2024-10-01' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/seasons/{year}/team-stats:
    get:
      tags: [팀 기록]
      summary: 2.1 팀 시즌 성적 조회
      operationId: listTeamSeasonStats
      description: >-
        시즌의 10개 구단을 해당 시즌 명칭으로 표시한다. 승·패는 소속 투수 기록의 합계이며 비율은 팀 원천 기록 합계로 계산한다.
        시즌 중 이적한 선수는 원천 기록에 남은 한 구단에만 집계한다.
      parameters:
        - { $ref: '#/components/parameters/Year' }
        - name: sort
          in: query
          schema: { type: string, enum: [wins, losses, runs, homeRuns, stolenBases, avg, ops, runsAllowed, era, whip] }
      responses:
        '200':
          description: 10개 구단의 시즌 집계 목록. 집계할 원천 값이 없으면 해당 지표는 null.
          content:
            application/json:
              schema: { type: array, minItems: 10, maxItems: 10, items: { $ref: '#/components/schemas/TeamStats' } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/seasons/{year}/teams/{teamId}/batting-stats:
    get:
      tags: [팀 기록]
      summary: 2.2 팀 타격 통계 조회
      operationId: getTeamBattingStats
      description: 해당 시즌 소속 타자를 정렬해 반환한다. 팀 타격 비율은 팀 원천 기록 합계에 타격 지표 계산식을 적용한다.
      parameters:
        - { $ref: '#/components/parameters/Year' }
        - { $ref: '#/components/parameters/TeamId' }
        - { $ref: '#/components/parameters/BattingSort' }
      responses:
        '200':
          description: 해당 구단의 선수별 타격 기록과 팀 합계. 선수 기록이 없으면 목록은 빈 배열, 합계는 null.
          content:
            application/json:
              schema:
                type: object
                required: [players, totals]
                properties:
                  players: { type: array, items: { $ref: '#/components/schemas/BatterRow' } }
                  totals:
                    anyOf:
                      - { $ref: '#/components/schemas/BattingStats' }
                      - { type: 'null' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/seasons/{year}/teams/{teamId}/pitching-stats:
    get:
      tags: [팀 기록]
      summary: 2.3 팀 투구 통계 조회
      operationId: getTeamPitchingStats
      description: 해당 시즌 소속 투수를 정렬해 반환한다. 팀 ERA는 자책점 합계에 27을 곱한 뒤 아웃 수 합계로 나눈다.
      parameters:
        - { $ref: '#/components/parameters/Year' }
        - { $ref: '#/components/parameters/TeamId' }
        - { $ref: '#/components/parameters/PitchingSort' }
      responses:
        '200':
          description: 해당 구단의 선수별 투구 기록과 팀 합계. 선수 기록이 없으면 목록은 빈 배열, 합계는 null.
          content:
            application/json:
              schema:
                type: object
                required: [players, totals]
                properties:
                  players: { type: array, items: { $ref: '#/components/schemas/PitcherRow' } }
                  totals:
                    anyOf:
                      - { $ref: '#/components/schemas/PitchingStats' }
                      - { type: 'null' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/games:
    get:
      tags: [경기 기록]
      summary: 3.1 경기 목록 조회
      operationId: listGames
      description: 현재 시드에는 종료 경기만 있다. 확인되지 않은 구장은 null로 반환한다.
      parameters:
        - { name: date, in: query, required: true, schema: { type: string, format: date }, example: '2024-10-01' }
        - { $ref: '#/components/parameters/TeamFilter' }
      responses:
        '200':
          description: 경기 목록. 결과가 빈 배열이면 화면에 경기 없음으로 표시한다.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Game' } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/games/{gameId}:
    get:
      tags: [경기 기록]
      summary: 3.2 경기 상세 조회
      operationId: getGameDetail
      description: 이닝별 점수와 선수별 경기 기록 확보 후 구현한다. 이닝 점수 합계는 최종 점수와 일치해야 한다.
      parameters:
        - { $ref: '#/components/parameters/GameId' }
      responses:
        '200':
          description: 경기 정보와 이닝별·선수별 기록
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/games/{gameId}/summary:
    parameters:
      - { $ref: '#/components/parameters/GameId' }
    get:
      tags: [경기 기록]
      summary: 3.3 저장된 경기 요약 조회
      operationId: getGameSummary
      responses:
        '200':
          description: 저장된 요약
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameSummary' }
        '404': { description: 경기 또는 저장된 요약이 없음 }
    post:
      tags: [경기 기록]
      summary: 3.3 경기 주요 이슈 요약 생성
      operationId: createGameSummary
      description: >-
        저장된 요약을 먼저 확인하고, 없으면 경기 기록에 있는 사실만 사용해 AI 요약을 생성·저장한다.
        상세 화면은 반환된 요약을 경기 기록과 함께 표시한다. 생성에 실패하면 경기 기록만 표시한다.
      responses:
        '200':
          description: 생성했거나 이미 저장된 요약
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameSummary' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 요약 생성에 필요한 상세 기록 없음 }
        '503': { description: 요약 생성 서비스 실패. 경기 상세 조회는 계속 가능하다. }
  /api/games/{gameId}/events:
    get:
      tags: [경기 기록]
      summary: 3.4 경기 리플레이 이벤트 조회 (확장)
      operationId: listGameEvents
      description: 이벤트 원본 확보 후 이닝·발생 순서대로 반환한다. 화면은 inning으로 이벤트를 묶어 이닝 단위로 이동한다.
      parameters:
        - { $ref: '#/components/parameters/GameId' }
      responses:
        '200':
          description: 이벤트 목록
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/GameEvent' } }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/players/compare:
    get:
      tags: [선수 비교 및 분석]
      summary: 4.1 선수 2인 비교
      operationId: comparePlayers
      description: >-
        타자끼리 또는 투수끼리 비교한다. season을 생략하면 2015년 이후 원천 기록을 합산해 통산 비율을 다시 계산한다.
        타자 비교 항목은 타율·홈런·타점·도루·OPS, 투수는 승·ERA·탈삼진·세이브·WHIP다.
        ERA·WHIP는 낮을수록, 나머지는 높을수록 우위다. 두 값이 같으면 tie, 한쪽이라도 계산 불가면 null이다.
        선수의 유형이 일치하지만 선택한 시즌 기록이 없는 경우 hasRecord는 false이며 화면에 기록 없음으로 표시한다.
      parameters:
        - { name: playerA, in: query, required: true, schema: { type: string, minLength: 1 }, example: sample-a }
        - { name: playerB, in: query, required: true, schema: { type: string, minLength: 1 }, example: sample-b }
        - { $ref: '#/components/parameters/StatType' }
        - { name: season, in: query, schema: { $ref: '#/components/schemas/Season' }, example: 2024 }
      responses:
        '200':
          description: 선수 정보와 항목별 비교 결과. 해당 시즌 기록이 없으면 hasRecord가 false이고 해당 값은 null.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comparison' }
              example:
                type: batter
                season: 2024
                playerA: { playerId: sample-a, playerName: 김예시, hasRecord: true }
                playerB: { playerId: sample-b, playerName: 박예시, hasRecord: true }
                metrics:
                  - { key: avg, playerA: 0.312, playerB: 0.287, better: A }
                  - { key: homeRuns, playerA: 21, playerB: 24, better: B }
                  - { key: runsBattedIn, playerA: 72, playerB: 72, better: tie }
                  - { key: stolenBases, playerA: 17, playerB: 9, better: A }
                  - { key: ops, playerA: 0.891, playerB: 0.846, better: A }
        '400': { description: 잘못된 입력, 동일 선수 선택 또는 비교 유형 불일치 }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/players/{playerId}/similar-players:
    get:
      tags: [선수 비교 및 분석]
      summary: 4.2 유사 선수 분석 (확장)
      operationId: listSimilarPlayers
      description: >-
        같은 시즌·유형의 선수 중 최소 표본을 충족한 후보의 대표 지표를 표준화한 뒤 거리 오름차순으로 최대 5명을 반환한다.
        최소 표본과 유사도 산식은 팀 합의 후 확정한다.
      parameters:
        - { $ref: '#/components/parameters/PlayerId' }
        - { $ref: '#/components/parameters/StatType' }
        - { name: season, in: query, required: true, schema: { $ref: '#/components/schemas/Season' }, example: 2024 }
      responses:
        '200':
          description: 유사 선수 목록
          content:
            application/json:
              schema:
                type: array
                maxItems: 5
                items:
                  type: object
                  required: [player, similarityPct]
                  properties:
                    player: { $ref: '#/components/schemas/Player' }
                    similarityPct: { type: number, minimum: 0, maximum: 100 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/seasons/{year}/matchup-predictions:
    get:
      tags: [선수 비교 및 분석]
      summary: 4.3 승부 예측 (확장)
      operationId: getMatchupPrediction
      description: 팀 OPS와 ERA에 기반한 결과다. 화면에 참고용임을 표시한다. 판정 기준은 팀 합의 후 확정한다.
      parameters:
        - { $ref: '#/components/parameters/Year' }
        - { name: teamA, in: query, required: true, schema: { type: string }, example: KIA }
        - { name: teamB, in: query, required: true, schema: { type: string }, example: LG }
      responses:
        '200':
          description: 우세 팀과 비교에 사용한 팀 지표
          content:
            application/json:
              schema:
                type: object
                required: [favoredTeamId, teams]
                properties:
                  favoredTeamId: { type: [string, 'null'], description: 동률 또는 판정 불가이면 null }
                  teams: { type: array, minItems: 2, maxItems: 2, items: { $ref: '#/components/schemas/TeamStats' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/imports:
    post:
      tags: [관리자]
      summary: 5.1 시즌 기록 CSV 적재
      operationId: importSeasonStats
      description: >-
        타자·투수 원본 CSV(1982~2026)에서 2015~2026년 행을 추출한다.
        시즌별 구단명 이력으로 10개 구단 ID에 매핑하며, 이력에 없는 이름은 행 오류로 처리한다.
        넥센·키움 및 SK·SSG는 각각 같은 구단 ID를 사용한다.
        이닝 9 1/3은 28아웃으로, 대시와 빈 값은 null로 변환하고 키·몸무게와 투구손·타격 방향을 각각 분리한다.
        두 파일의 선수를 원본 ID로 통합하고 유형별 선수·시즌당 한 행만 허용한다.
        5.3 검증을 통과한 행의 원천 값과 데이터 출처를 저장한다. 비율은 조회 시 계산한다.
        CLI 적재만 제공할 경우 이 경로는 생략한다.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [battingCsv, pitchingCsv]
              properties:
                battingCsv: { type: string, format: binary }
                pitchingCsv: { type: string, format: binary }
      responses:
        '200':
          description: 적재 건수와 행별 오류
          content:
            application/json:
              schema:
                type: object
                required: [battingRowsImported, pitchingRowsImported, errors]
                properties:
                  battingRowsImported: { type: integer, minimum: 0 }
                  pitchingRowsImported: { type: integer, minimum: 0 }
                  errors:
                    type: array
                    items:
                      type: object
                      required: [file, row, message]
                      properties:
                        file: { type: string, enum: [battingCsv, pitchingCsv] }
                        row: { type: integer, minimum: 1 }
                        message: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/admin/players/{playerId}/batting-stats/{year}:
    patch:
      tags: [관리자]
      summary: 5.3 타자 시즌 기록 수정
      operationId: updateBattingStats
      description: >-
        기존 기록에 수정값을 반영한 결과를 검증한다. 타수는 타석 이하여야 하고, 안타는 2루타·3루타·홈런 합계 이상이어야 한다.
        누적 기록은 음수일 수 없으며, 검증 실패 시 저장하지 않는다.
      parameters:
        - { $ref: '#/components/parameters/PlayerId' }
        - { $ref: '#/components/parameters/Year' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BattingUpdate' }
            example: { homeRuns: 22 }
      responses:
        '200':
          description: 검증 및 저장 후 기록
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatterRow' }
        '400': { $ref: '#/components/responses/InvalidRecord' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/players/{playerId}/pitching-stats/{year}:
    patch:
      tags: [관리자]
      summary: 5.3 투수 시즌 기록 수정
      operationId: updatePitchingStats
      description: >-
        기존 기록에 수정값을 반영한 결과를 검증한다. 자책점은 실점 이하여야 하고, 피홈런은 피안타 이하여야 한다.
        누적 기록은 음수일 수 없으며, 검증 실패 시 저장하지 않는다.
      parameters:
        - { $ref: '#/components/parameters/PlayerId' }
        - { $ref: '#/components/parameters/Year' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PitchingUpdate' }
            example: { outsPitched: 432 }
      responses:
        '200':
          description: 검증 및 저장 후 기록
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PitcherRow' }
        '400': { $ref: '#/components/responses/InvalidRecord' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/players:
    post:
      tags: [관리자]
      summary: 5.4 선수 등록
      operationId: createPlayer
      description: 원본 선수 ID로 등록한다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePlayer' }
            example: { playerId: sample-a, playerName: 김예시 }
      responses:
        '201':
          description: 등록된 선수
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Player' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: 이미 등록된 선수 ID }
  /api/admin/players/{playerId}:
    patch:
      tags: [관리자]
      summary: 5.4 선수 기본 정보 수정
      operationId: updatePlayer
      description: 선수 기본 정보를 수정한다. 원본 선수 ID는 유지한다.
      parameters:
        - { $ref: '#/components/parameters/PlayerId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePlayer' }
            example: { birthDate: '2000-01-01' }
      responses:
        '200':
          description: 수정된 선수
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Player' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  parameters:
    Year:
      name: year
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Season' }
      example: 2024
    PlayerId:
      name: playerId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
      example: sample-a
    GameId:
      name: gameId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    TeamId:
      name: teamId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
      example: KIA
    TeamFilter:
      name: teamId
      in: query
      schema: { type: string, minLength: 1 }
      example: KIA
    StatType:
      name: type
      in: query
      required: true
      schema: { $ref: '#/components/schemas/StatType' }
      example: batter
    Qualified:
      name: qualified
      in: query
      description: 생략하면 규정 충족 여부로 필터링하지 않는다.
      schema: { type: boolean }
    BattingSort:
      name: sort
      in: query
      description: 모든 타격 정렬 항목은 값이 높은 순으로 반환한다.
      schema: { type: string, enum: [avg, obp, slg, ops, homeRuns, runsBattedIn, stolenBases] }
    PitchingSort:
      name: sort
      in: query
      description: ERA와 WHIP는 값이 낮은 순으로, 승·탈삼진·세이브는 값이 높은 순으로 반환한다.
      schema: { type: string, enum: [wins, era, strikeouts, saves, whip] }
  responses:
    BadRequest:
      description: 입력 형식·범위 또는 데이터 검증 규칙 위반
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorMessage' }
    InvalidRecord:
      description: 입력 형식·범위 또는 기록 검증 규칙 위반. 위반 내용을 반환한다.
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message: { type: string }
          example: { message: 타수는 타석 이하여야 합니다. }
    NotFound:
      description: 요청한 리소스가 존재하지 않음
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorMessage' }
  schemas:
    ErrorMessage:
      type: object
      required: [message]
      properties:
        message: { type: string }
    Season: { type: integer, minimum: 2015, maximum: 2026 }
    StatType: { type: string, enum: [batter, pitcher] }
    Position: { type: [string, 'null'], enum: [P, C, '1B', '2B', '3B', SS, OF, DH, null], description: 외야수는 OF로 통합한다. }
    Count: { type: [integer, 'null'], minimum: 0 }
    Rate: { type: [number, 'null'], minimum: 0, description: 분모가 0이거나 원천 값이 없으면 null로 반환하며 화면은 대시로 표시한다. }
    Team:
      type: object
      required: [teamId, teamName]
      properties:
        teamId: { type: string }
        teamName: { type: string, description: 기록이 속한 시즌 당시의 구단명 }
    Standing:
      allOf:
        - { $ref: '#/components/schemas/Team' }
        - type: object
          required: [rank, wins, losses, draws, winningPct, asOfDate, games, gamesBehind]
          properties:
            rank: { type: integer, minimum: 1 }
            wins: { type: integer, minimum: 0 }
            losses: { type: integer, minimum: 0 }
            draws: { type: integer, minimum: 0 }
            winningPct: { type: [number, 'null'], minimum: 0, maximum: 1 }
            asOfDate: { type: string, format: date }
            games: { type: integer, minimum: 0 }
            gamesBehind: { type: [number, 'null'], minimum: 0 }
    Player:
      type: object
      required: [playerId, playerName, birthDate]
      properties:
        playerId: { type: string }
        playerName: { type: string }
        birthDate: { type: [string, 'null'], format: date }
        heightCm: { type: [number, 'null'], exclusiveMinimum: 0 }
        weightKg: { type: [number, 'null'], exclusiveMinimum: 0 }
        throwHand: { enum: [R, L, null] }
        batHand: { enum: [R, L, S, null] }
    PlayerSeason:
      allOf:
        - { $ref: '#/components/schemas/Player' }
        - { $ref: '#/components/schemas/Team' }
        - type: object
          required: [season, position]
          properties:
            season: { $ref: '#/components/schemas/Season' }
            position: { $ref: '#/components/schemas/Position' }
    BattingCounts:
      type: object
      properties:
        games: { $ref: '#/components/schemas/Count' }
        plateAppearances: { $ref: '#/components/schemas/Count' }
        atBats: { $ref: '#/components/schemas/Count' }
        runs: { $ref: '#/components/schemas/Count' }
        hits: { $ref: '#/components/schemas/Count' }
        doubles: { $ref: '#/components/schemas/Count' }
        triples: { $ref: '#/components/schemas/Count' }
        homeRuns: { $ref: '#/components/schemas/Count' }
        runsBattedIn: { $ref: '#/components/schemas/Count' }
        stolenBases: { $ref: '#/components/schemas/Count' }
        caughtStealing: { $ref: '#/components/schemas/Count' }
        walks: { $ref: '#/components/schemas/Count' }
        hitByPitch: { $ref: '#/components/schemas/Count' }
        strikeouts: { $ref: '#/components/schemas/Count' }
        sacrificeHits: { $ref: '#/components/schemas/Count' }
        sacrificeFlies: { $ref: '#/components/schemas/Count' }
        groundedIntoDoublePlays: { $ref: '#/components/schemas/Count' }
    PitchingCounts:
      type: object
      properties:
        games: { $ref: '#/components/schemas/Count' }
        wins: { $ref: '#/components/schemas/Count' }
        losses: { $ref: '#/components/schemas/Count' }
        saves: { $ref: '#/components/schemas/Count' }
        holds: { $ref: '#/components/schemas/Count' }
        outsPitched: { $ref: '#/components/schemas/Count', description: 투구 아웃 수. 3아웃은 1이닝이다. }
        hitsAllowed: { $ref: '#/components/schemas/Count' }
        homeRunsAllowed: { $ref: '#/components/schemas/Count' }
        walksAllowed: { $ref: '#/components/schemas/Count' }
        hitBatters: { $ref: '#/components/schemas/Count' }
        strikeouts: { $ref: '#/components/schemas/Count' }
        runsAllowed: { $ref: '#/components/schemas/Count' }
        earnedRuns: { $ref: '#/components/schemas/Count' }
        battersFaced: { $ref: '#/components/schemas/Count' }
    BattingStats:
      allOf:
        - { $ref: '#/components/schemas/BattingCounts' }
        - type: object
          properties:
            avg: { $ref: '#/components/schemas/Rate', description: '안타 ÷ 타수' }
            obp: { $ref: '#/components/schemas/Rate', description: '(안타 + 볼넷 + 사구) ÷ (타수 + 볼넷 + 사구 + 희생플라이)' }
            slg: { $ref: '#/components/schemas/Rate', description: '루타 ÷ 타수' }
            ops: { $ref: '#/components/schemas/Rate', description: '출루율 + 장타율' }
    PitchingStats:
      allOf:
        - { $ref: '#/components/schemas/PitchingCounts' }
        - type: object
          properties:
            era: { $ref: '#/components/schemas/Rate', description: '자책점 × 27 ÷ 아웃 수' }
            whip: { $ref: '#/components/schemas/Rate', description: '(피안타 + 허용 볼넷) × 3 ÷ 아웃 수' }
            winningPct: { type: [number, 'null'], minimum: 0, maximum: 1, description: '승 ÷ (승 + 패). 분모가 0이거나 원천 값이 없으면 null.' }
    BatterRow:
      allOf:
        - { $ref: '#/components/schemas/PlayerSeason' }
        - { $ref: '#/components/schemas/BattingStats' }
        - type: object
          properties:
            qualified: { type: [boolean, 'null'] }
    PitcherRow:
      allOf:
        - { $ref: '#/components/schemas/PlayerSeason' }
        - { $ref: '#/components/schemas/PitchingStats' }
        - type: object
          properties:
            qualified: { type: [boolean, 'null'] }
    TeamStats:
      allOf:
        - { $ref: '#/components/schemas/Team' }
        - type: object
          required: [wins, losses, runs, homeRuns, stolenBases, avg, ops, runsAllowed, era, whip]
          properties:
            wins: { $ref: '#/components/schemas/Count' }
            losses: { $ref: '#/components/schemas/Count' }
            runs: { $ref: '#/components/schemas/Count' }
            homeRuns: { $ref: '#/components/schemas/Count' }
            stolenBases: { $ref: '#/components/schemas/Count' }
            avg: { $ref: '#/components/schemas/Rate' }
            ops: { $ref: '#/components/schemas/Rate' }
            runsAllowed: { $ref: '#/components/schemas/Count' }
            era: { $ref: '#/components/schemas/Rate' }
            whip: { $ref: '#/components/schemas/Rate' }
    Game:
      type: object
      required: [gameId, date, homeTeam, awayTeam, homeScore, awayScore, stadium, status]
      properties:
        gameId: { type: string }
        date: { type: string, format: date }
        homeTeam: { $ref: '#/components/schemas/Team' }
        awayTeam: { $ref: '#/components/schemas/Team' }
        homeScore: { $ref: '#/components/schemas/Count' }
        awayScore: { $ref: '#/components/schemas/Count' }
        stadium: { type: [string, 'null'] }
        status: { type: string, enum: [SCHEDULED, COMPLETED, CANCELLED, POSTPONED] }
    GameDetail:
      allOf:
        - { $ref: '#/components/schemas/Game' }
        - type: object
          required: [inningScores, battingStats, pitchingStats]
          properties:
            inningScores:
              type: array
              items:
                type: object
                required: [inning, half, runs]
                properties:
                  inning: { type: integer, minimum: 1 }
                  half: { type: string, enum: [T, B] }
                  runs: { type: integer, minimum: 0 }
            battingStats:
              type: array
              items:
                allOf:
                  - { $ref: '#/components/schemas/GamePlayer' }
                  - { $ref: '#/components/schemas/BattingCounts' }
            pitchingStats:
              type: array
              items:
                allOf:
                  - { $ref: '#/components/schemas/GamePlayer' }
                  - { $ref: '#/components/schemas/PitchingCounts' }
    GamePlayer:
      type: object
      required: [playerId, playerName, teamSide]
      properties:
        playerId: { type: string }
        playerName: { type: string }
        teamSide: { type: string, enum: [H, A] }
    GameSummary:
      type: object
      required: [gameId, summary, generatedAt]
      properties:
        gameId: { type: string }
        summary: { type: string }
        generatedAt: { type: string, format: date-time }
    GameEvent:
      type: object
      required: [sequence, inning, half, description]
      properties:
        sequence: { type: integer, minimum: 1 }
        inning: { type: integer, minimum: 1 }
        half: { type: string, enum: [T, B] }
        description: { type: string }
    ComparedPlayer:
      type: object
      required: [playerId, playerName, hasRecord]
      properties:
        playerId: { type: string }
        playerName: { type: string }
        hasRecord: { type: boolean }
    Comparison:
      type: object
      required: [type, season, playerA, playerB, metrics]
      properties:
        type: { $ref: '#/components/schemas/StatType' }
        season: { type: [integer, 'null'], minimum: 2015, maximum: 2026, description: 통산 비교면 null }
        playerA: { $ref: '#/components/schemas/ComparedPlayer' }
        playerB: { $ref: '#/components/schemas/ComparedPlayer' }
        metrics:
          type: array
          items:
            type: object
            required: [key, playerA, playerB, better]
            properties:
              key: { type: string, enum: [avg, homeRuns, runsBattedIn, stolenBases, ops, wins, era, strikeouts, saves, whip] }
              playerA: { type: [number, 'null'] }
              playerB: { type: [number, 'null'] }
              better: { enum: [A, B, tie, null], description: 비교할 수 없으면 null }
    BattingUpdate:
      allOf:
        - { $ref: '#/components/schemas/BattingCounts' }
        - { type: object, minProperties: 1 }
      unevaluatedProperties: false
    PitchingUpdate:
      allOf:
        - { $ref: '#/components/schemas/PitchingCounts' }
        - { type: object, minProperties: 1 }
      unevaluatedProperties: false
    PlayerFields:
      type: object
      properties:
        playerName: { type: string, minLength: 1 }
        birthDate: { type: [string, 'null'], format: date }
        heightCm: { type: [number, 'null'], exclusiveMinimum: 0 }
        weightKg: { type: [number, 'null'], exclusiveMinimum: 0 }
        throwHand: { enum: [R, L, null] }
        batHand: { enum: [R, L, S, null] }
    CreatePlayer:
      allOf:
        - { $ref: '#/components/schemas/PlayerFields' }
        - type: object
          required: [playerId, playerName]
          properties:
            playerId: { type: string, minLength: 1 }
      unevaluatedProperties: false
    UpdatePlayer:
      allOf:
        - { $ref: '#/components/schemas/PlayerFields' }
        - { type: object, minProperties: 1 }
      unevaluatedProperties: false
