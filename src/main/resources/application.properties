spring.application.name=Fullcount-BE
spring.datasource.url=jdbc:sqlite:file:data/fullcount.db?mode=rw
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
springdoc.swagger-ui.url=/openapi.yaml
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:game-detail-schema.sql
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=21MB
fullcount.game-detail.url=${FULLCOUNT_GAME_DETAIL_URL:}
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.name=FULLCOUNT_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
