spring.application.name=Fullcount-BE
spring.datasource.url=jdbc:sqlite:file:data/fullcount.db?mode=rw
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
springdoc.swagger-ui.url=/openapi.yaml
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:game-detail-schema.sql
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=21MB
